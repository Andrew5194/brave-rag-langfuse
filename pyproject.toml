[project]
name = "brave-langfuse-demo"
version = "0.1.0"
description = "Brave Search API value comparison: baseline vs grounded vs DIY-RAG, scored with LangFuse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Shared by all three pipelines
    "anthropic>=0.40.0",
    "langfuse>=4.0.0",
    "httpx>=0.27.0",
    # DIY RAG pipeline only — these are what Brave's LLM Context endpoint replaces
    "trafilatura>=1.12.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    # Notebook surface
    "jupyterlab>=4.0.0",
]
