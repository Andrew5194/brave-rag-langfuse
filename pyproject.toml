[project]
name = "brave-langfuse-demo"
version = "0.1.0"
description = "Brave Search API value comparison: baseline vs diy-rag vs brave-search-api, scored with LangFuse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Shared by all three pipelines
    "anthropic>=0.40.0",
    "langfuse>=4.0.0",
    "requests>=2.32.0",
    # DIY RAG pipeline only — these are what Brave's LLM Context endpoint replaces
    "trafilatura>=1.12.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    # Notebook surface
    "jupyterlab>=4.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
# Never walk local agent worktrees / scratch state under .claude/.
extend-exclude = [".claude"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade.
select = ["E", "W", "F", "I", "UP"]
# `ruff format` already enforces line length on code; the only E501 hits left
# are tuned prompt/docstring strings, where hard-wrapping hurts readability.
ignore = ["E501"]
